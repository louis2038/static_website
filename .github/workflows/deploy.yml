name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The customized local Typst package is versioned with this repository.
      TYPST_PACKAGE_PATH: ${{ github.workspace }}/typst-packages
    steps:
      - uses: actions/checkout@v5
      - uses: typst-community/setup-typst@v4
      - id: pages
        uses: actions/configure-pages@v4
      - run: make html TYPST_INPUTS="--input base-url=${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
